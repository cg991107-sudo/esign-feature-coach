# Render 部署配置 (Blueprint)
# 用法：在 Render 控制台 New → Blueprint → 连接本仓库，自动按此配置创建服务
services:
  - type: web
    name: esign-feature-coach
    runtime: python
    region: singapore          # 亚太节点，国内访问延迟更低
    plan: free                 # 免费版即可运行；如需数据持久化请升级 Starter 并在控制台挂载磁盘
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health   # 避免首页 302 登录重定向被误判为不健康
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: DATA_DIR
        value: /data          # 上传文件等临时目录；数据库已改用下方 Postgres，不受此影响
      # 数据库连接串：由下方 databases 中的 coach-db 自动注入，无需手动填写
      - key: DATABASE_URL
        fromDatabase:
          name: coach-db
          property: connectionString
      # ↓↓↓ AI 判分开关：填入 OPENAI_API_KEY 即启用真 AI 判分；留空则自动降级为规则判分
      - key: OPENAI_API_KEY
        value: ""            # 部署后在 Render 控制台「Environment → Environment Variables」填入你的 key
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1   # 可用国内兼容端点（DeepSeek / 硅基流动 / 阿里云百炼等）替换
      - key: OPENAI_MODEL
        value: gpt-4o-mini  # 按所用端点支持的模型填写（如 deepseek-chat）

# 持久化数据库：免费 Postgres（数据不会因服务休眠/重新部署而丢失）
# 升级套餐后可改为 basic/paid 计划以提升性能与容量
databases:
  - name: coach-db
    databaseName: coach
    user: coach
    region: singapore
    plan: free
    postgresMajorVersion: "16"

