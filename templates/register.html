{% extends "base.html" %}
{% block title %}注册身份{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-person-plus text-primary"></i> 首次使用 · 注册身份</h4>
        <p class="text-muted small mb-4">填写你的姓名与身份，提交后即自动登录。身份选错也没关系，可联系管理员修改。</p>
        <form method="post" action="{{url_for('register_page')}}">
          <div class="mb-3">
            <label class="form-label">姓名 <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="如：张明" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">身份 <span class="text-danger">*</span></label>
            <select name="role" class="form-select">
              <option value="sfr">SFR（售前）</option>
              <option value="business">商务（AR）</option>
            </select>
            <small class="text-muted">管理员身份仅由现有管理员创建，不在自助注册范围内。</small>
          </div>
          <button class="btn btn-brand w-100"><i class="bi bi-check-circle"></i> 注册并进入</button>
        </form>
        <div class="text-center mt-3">
          <span class="text-muted small">已经是注册用户？</span>
          <a href="{{url_for('login_page')}}" class="small">直接登录</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
