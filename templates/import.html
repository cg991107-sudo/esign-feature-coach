{% extends "base.html" %}
{% block title %}导入功能{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold mb-0"><i class="bi bi-upload text-primary"></i> 导入 / 添加功能</h3>
  <a href="{{url_for('features_page')}}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
</div>

<div class="row g-4">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><i class="bi bi-file-earmark-spreadsheet"></i> Excel 批量导入</div>
      <div class="card-body">
        <p class="text-muted small">上传 Excel 文件（.xlsx），第一行为表头，格式如下：</p>
        <table class="table table-sm table-bordered mb-3">
          <thead class="table-light"><tr><th>功能编号</th><th>功能名称</th><th>分类（可选）</th></tr></thead>
          <tbody><tr><td>F001</td><td>电子签名</td><td>签署核心</td></tr><tr><td>F002</td><td>实名认证</td><td>身份认证</td></tr></tbody>
        </table>
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <input type="file" name="file" accept=".xlsx,.xls" class="form-control" required>
          </div>
          <button class="btn btn-brand"><i class="bi bi-cloud-upload"></i> 开始导入</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="card">
      <div class="card-header"><i class="bi bi-plus-square"></i> 手动添加单个</div>
      <div class="card-body">
        <form method="post" action="{{url_for('import_features')}}">
          <div class="mb-3"><label class="form-label small">功能编号（可选）</label><input type="text" name="code" class="form-control" placeholder="F001"></div>
          <div class="mb-3"><label class="form-label small">功能名称 *</label><input type="text" name="name" class="form-control" placeholder="电子签名" required></div>
          <div class="mb-3"><label class="form-label small">分类（可选）</label><input type="text" name="category" class="form-control" placeholder="签署核心"></div>
          <button class="btn btn-outline-primary w-100"><i class="bi bi-plus-circle"></i> 添加</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
