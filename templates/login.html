{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-box-arrow-in-right text-primary"></i> 进入系统</h4>
        <p class="text-muted small mb-4">请输入管理员为你创建的姓名，即可登录（身份已由管理员预先设定，无需自行选择）。</p>
        <form method="post" action="{{url_for('login_page')}}">
          <div class="mb-3">
            <label class="form-label">姓名 <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control form-control-lg" placeholder="如：张明" required autofocus>
          </div>
          <button class="btn btn-brand w-100 btn-lg"><i class="bi bi-box-arrow-in-right"></i> 登录</button>
        </form>
        <div class="text-center mt-3">
          <span class="text-muted small">没有你的账号？请联系管理员在「用户管理」中创建。</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
